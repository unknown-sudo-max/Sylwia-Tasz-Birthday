<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sylwia's Birthday Celebration ❤️</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital@1&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Metal&display=swap"
        rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            color: #495057;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .jumbotron {
            background: linear-gradient(135deg, #f59292, #e97878);
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            border-radius: 0 0 25px 25px;
            margin-bottom: 0;
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.2);
        }

        .jumbotron h1 {
            font-family: 'Metal', serif;
        }

        .birthday-message {
            font-size: 18px;
            margin-top: 25px;
            line-height: 1.8;
        }

        .birthday-message p {
            margin-bottom: 18px;
        }

        .heart {
            display: inline-block;
            font-size: 2rem;
            animation: heartbeat 1s infinite;
            color: #fff;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        /* My Wife */
        .wife-title {
            font-family: 'Metal', serif;
            font-size: 36px;
            margin-top: 5px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.25);
        }

        .wife-title-heart {
            display: inline-block;
            animation: heartbeat 1.2s infinite;
        }

        /* Countdown */
        #countdown {
            font-size: 28px;
            font-weight: bold;
            margin-top: 35px;
            margin-bottom: 20px;
            color: #dc3545;
            text-align: center;
            font-family: 'Metal', serif;
        }

        /* Image */
        .img-fluid {
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        /* Language switch */
        .switch-container {
            display: flex;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .switch-btn {
            display: inline-block;
            width: 55px;
            height: 28px;
            background-color: #dcdcdc;
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
        }

        .switch-handle {
            width: 24px;
            height: 24px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .switch-btn.active {
            background-color: #007bff !important;
        }

        .switch-btn.active .switch-handle {
            transform: translateX(27px);
        }

        .switch-btn:hover {
            background-color: #b0b0b0;
        }

        .trans {
            font-size: 16px;
            color: #495057;
            cursor: pointer;
        }

        .exp {
            margin-left: 5px;
        }

        /* Highlighted text */
        .msgclass {
            background-color: #fb9f9cba;
            color: black;
            border-radius: 10px;
            padding: 3px 7px;
        }

        /* Forever message */
        .divv {
            text-align: center;
            color: #dc3545;
            font-size: 25px;
            margin-top: 35px;
            font-family: 'Metal', serif;
        }

        /* Polish */
        .polish-text {
            font-family: 'Afacad', sans-serif;
            font-size: 20px;
            line-height: 1.8;
        }

        /* Final message */
        .final-message {
            margin-top: 35px;
            margin-bottom: 20px;
            text-align: center;
            background-color: #fb9f9cba;
            color: #000;
            border-radius: 12px;
            padding: 12px;
            font-size: 20px;
        }

        @media (max-width: 767px) {

            .jumbotron {
                padding: 40px 15px;
            }

            .jumbotron h1 {
                font-size: 34px;
            }

            .wife-title {
                font-size: 30px;
            }

            .birthday-message {
                font-size: 17px;
            }

            .divv {
                font-size: 21px;
            }

            .container {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="jumbotron">

        <h1 class="display-4">
            Happy Birthday, Sylwia
            <span class="heart">❤</span>
        </h1>

        <h2 class="wife-title">
            My Wife
            <span class="wife-title-heart">❤️</span>
        </h2>

        <p class="lead">
            Wishing you all days filled with love, joy, and unforgettable moments.
        </p>

    </div>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <div class="container">

        <div class="row align-items-center">

            <!-- IMAGE -->
            <div class="col-md-6 mb-4">

                <img src="./img/p2.png"
                    alt="Sylwia"
                    class="img-fluid">

            </div>


            <!-- MESSAGE -->
            <div class="col-md-6">

                <!-- Language Switch -->
                <div class="switch-container">

                    <div class="switch-btn"
                        onclick="toggleLanguage()">

                        <div class="switch-handle"></div>

                    </div>

                    <span class="trans exp">
                        Translate to Polish
                    </span>

                </div>


                <!-- Birthday Message -->
                <div class="birthday-message"
                    id="birthday-message">
                </div>

            </div>

        </div>


        <!-- =========================================
             ROMANTIC MESSAGE
        ========================================== -->

        <div class="divv">

            <b>
                Love you to the end of days = forever ❤
            </b>

        </div>


        <!-- =========================================
             COUNTDOWN
        ========================================== -->

        <div id="countdown"></div>


        <!-- =========================================
             BACKGROUND MUSIC
             
             Same old method:
             autoplay + hidden audio
        ========================================== -->

        <audio id="bgMusic"
            style="display: none;"
            autoplay
            loop>

            <source src="time2.mp3"
                type="audio/mpeg">

            Your browser does not support the audio element.

        </audio>

    </div>


    <!-- =========================================
         BOOTSTRAP JS
    ========================================== -->

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>


    <!-- =========================================
         CUSTOM JAVASCRIPT
    ========================================== -->

    <script>

        /* =========================================
           LANGUAGE
        ========================================= */

        let isEnglish = true;


        /* =========================================
           BIRTHDAY DATE
           
           January 11
        ========================================= */

        const birthdayMonth = 0;
        const birthdayDay = 11;


        /* =========================================
           COUNTDOWN
        ========================================= */

        const countdownElement =
            document.getElementById('countdown');


        function getNextBirthday() {

            const now = new Date();

            let birthday =
                new Date(
                    now.getFullYear(),
                    birthdayMonth,
                    birthdayDay,
                    0,
                    0,
                    0
                );


            if (birthday <= now) {

                birthday =
                    new Date(
                        now.getFullYear() + 1,
                        birthdayMonth,
                        birthdayDay,
                        0,
                        0,
                        0
                    );

            }

            return birthday;
        }


        function updateCountdown() {

            const now = new Date();

            const birthday =
                getNextBirthday();

            const timeDiff =
                birthday - now;


            if (timeDiff <= 0) {
                return;
            }


            const days =
                Math.floor(
                    timeDiff /
                    (1000 * 60 * 60 * 24)
                );


            const hours =
                Math.floor(
                    (timeDiff /
                        (1000 * 60 * 60)) % 24
                );


            const minutes =
                Math.floor(
                    (timeDiff /
                        (1000 * 60)) % 60
                );


            const seconds =
                Math.floor(
                    (timeDiff / 1000) % 60
                );


            if (isEnglish) {

                countdownElement.innerHTML = `
                    Next Birthday ❤️
                    <br>
                    <small>
                        ${days} days,
                        ${hours} hours,
                        ${minutes} minutes,
                        ${seconds} seconds
                    </small>
                `;

            } else {

                countdownElement.innerHTML = `
                    Do następnych urodzin ❤️
                    <br>
                    <small>
                        ${days} dni,
                        ${hours} godzin,
                        ${minutes} minut,
                        ${seconds} sekund
                    </small>
                `;

            }

        }


        /* =========================================
           ENGLISH MESSAGE
        ========================================= */

        function setEnglishMessage() {

            const birthdayMessageElement =
                document.getElementById('birthday-message');


            birthdayMessageElement.innerHTML = `

                <p>
                    Dear Sylwia,
                </p>


                <p>
                    On this special day, I want to celebrate not just
                    the day you were born but the unique and incredible
                    woman you are.
                    <span class="msgclass">
                        Your presence in my life
                    </span>
                    is a gift that brings me joy, warmth, and inspiration.
                    And I want to express my deepest gratitude for having
                    you in my life. ❤
                </p>


                <p>
                    Your kindness, warmth, and infectious joy
                    <span class="msgclass">
                        have made every moment
                    </span>
                    brighter.
                    May this birthday mark the beginning of a year
                    filled with love, success, happiness, and
                    <span class="msgclass">
                        unforgettable
                    </span>
                    beautiful memories.
                </p>


                <p>
                    May this year be filled with moments that make
                    your heart smile, surrounded by the love of those
                    who cherish you.
                    As you embark on another year, may it be a journey
                    of growth, fulfillment, beautiful surprises,
                    and dreams coming true.
                </p>


                <p>
                    You deserve everything that is good and beautiful,
                    all the roses in the world,
                    and so much more than that. ❤
                </p>


                <p>
                    Thank you for being the wonderful woman that you are.
                    I celebrate you today and every day.
                    Happy birthday to the woman I love —
                    for every reason, and sometimes for no reason at all. ❤
                </p>


                <br>


                <div class="final-message">

                    — Your presence in my life has made
                    every moment unforgettable ❤

                </div>

            `;


            document.querySelector('.trans').textContent =
                'Translate to Polish';


            updateCountdown();

        }


        /* =========================================
           POLISH MESSAGE
        ========================================= */

        function setPolishMessage() {

            const birthdayMessageElement =
                document.getElementById('birthday-message');


            birthdayMessageElement.innerHTML = `

                <div class="polish-text">

                    <p>
                        Kochana Sylwio,
                    </p>


                    <p>
                        W tym wyjątkowym dniu chcę świętować nie tylko
                        dzień Twoich urodzin, ale przede wszystkim
                        niezwykłą i wyjątkową kobietę, którą jesteś.
                        <span class="msgclass">
                            Twoja obecność w moim życiu
                        </span>
                        jest prezentem, który przynosi mi radość,
                        ciepło i inspirację.
                        Chcę wyrazić moją najgłębszą wdzięczność
                        za to, że jesteś częścią mojego życia. ❤
                    </p>


                    <p>
                        Twoja dobroć, ciepło i radość,
                        którą zarażasz innych,
                        <span class="msgclass">
                            sprawiają, że każda chwila
                        </span>
                        staje się piękniejsza.
                        Niech te urodziny będą początkiem roku
                        pełnego miłości, sukcesów, szczęścia
                        i <span class="msgclass">
                            niezapomnianych
                        </span>
                        pięknych wspomnień.
                    </p>


                    <p>
                        Życzę Ci, aby ten rok był pełen chwil,
                        które wywołują uśmiech na Twojej twarzy
                        i w Twoim sercu, otoczony miłością ludzi,
                        którzy Cię kochają i doceniają.
                        Niech kolejny rok Twojego życia będzie pełen
                        rozwoju, spełnienia marzeń,
                        pięknych niespodzianek
                        i chwil, które będziesz wspominać z uśmiechem.
                    </p>


                    <p>
                        Zasługujesz na wszystko, co dobre i piękne,
                        na wszystkie róże tego świata,
                        a nawet na jeszcze więcej. ❤
                    </p>


                    <p>
                        Dziękuję Ci za to, że jesteś tak wspaniałą kobietą.
                        Dziś i każdego dnia świętuję Ciebie.
                        Wszystkiego najlepszego, moja ukochana,
                        którą pokochałem z powodu
                        i bez powodu. ❤
                    </p>


                    <br>


                    <div class="final-message">

                        — Twoja obecność w moim życiu sprawiła,
                        że każda chwila stała się niezapomniana ❤

                    </div>

                </div>

            `;


            document.querySelector('.trans').textContent =
                'Translate to English';


            updateCountdown();

        }


        /* =========================================
           LANGUAGE TOGGLE
        ========================================= */

        function toggleLanguage() {

            if (isEnglish) {

                setPolishMessage();

            } else {

                setEnglishMessage();

            }


            isEnglish = !isEnglish;


            const switchBtn =
                document.querySelector('.switch-btn');


            switchBtn.classList.toggle('active');


            updateCountdown();

        }


        /* =========================================
           OLD-STYLE BACKGROUND MUSIC
           
           This is the same approach as your
           original code: autoplay hidden audio.
        ========================================= */

        const bgMusic =
            document.getElementById('bgMusic');


        function startBackgroundMusic() {

            bgMusic.play().catch(function (error) {

                console.log(
                    "Autoplay was blocked by the browser."
                );

            });

        }


        /*
         * Try to start automatically when the
         * page loads.
         */

        window.addEventListener('load', function () {

            startBackgroundMusic();

        });


        /*
         * Some browsers allow autoplay after the
         * visitor interacts with the page.
         *
         * This keeps the old behavior without
         * showing a music button.
         */

        document.addEventListener('click', function () {

            if (bgMusic.paused) {

                startBackgroundMusic();

            }

        }, {
            once: true
        });


        /* =========================================
           INITIALIZE
        ========================================= */

        setEnglishMessage();

        updateCountdown();

        setInterval(updateCountdown, 1000);

    </script>

</body>

</html>
